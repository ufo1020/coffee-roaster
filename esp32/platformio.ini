; PlatformIO project for the coffee-roaster ESP32 controller.
;
;   Day-to-day flashing is OTA (the running firmware includes ArduinoOTA).
;   Use USB only for recovery, or to flash a build with no OTA (e.g. ssrtest).
;
;   USB : pio run -e usb -t upload            (auto-detects /dev/ttyUSB0)
;   OTA : OTA_PASSWORD=xxx pio run -e ota -t upload   (over WiFi, espota :3232)
;   Logs: pio device monitor                  (USB)  — OTA logs go to serial too

[platformio]
default_envs = usb

; ---- settings shared by every environment ----
[env]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/MAX6675 library @ ^1.1.2              ; K-type thermocouple (Bean Temp)
    br3ttb/PID @ ^1.2.1                            ; heater PID
    knolleary/PubSubClient @ ^2.8                  ; MQTT client (control + telemetry)
    bblanchon/ArduinoJson @ ^7.0                   ; status payload encode / setpoint decode
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; Firmware version defaults to the literal in config.h. Override per-flash
    ; without editing source, e.g.:  -DFW_VERSION='"2026.08.05b"'
    ; (published retained to <base>/version; also on the serial boot banner).

; ---- USB upload (initial flash / recovery) ----
[env:usb]
upload_speed = 460800
; upload_port auto-detected; pin with:  --upload-port /dev/ttyUSB0

; ---- OTA upload (day-to-day, wireless) ----
[env:ota]
upload_protocol = espota
; mDNS hostname, not a hardcoded IP — survives DHCP lease changes.
; (Needs mDNS/Bonjour on the uploading machine; on Linux that's avahi-daemon.
;  If .local won't resolve, fall back to the current IP or set a DHCP reservation.)
upload_port     = coffee-roaster-esp32.local
; OTA password is read from the environment so it stays out of git.
; Must match OTA_PASSWORD in secrets.h.
upload_flags    = --auth=${sysenv.OTA_PASSWORD}
